[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiface-websocket-python"
version = "0.1.0"
description = "WebSocket server and device SDK for AiFace face-recognition attendance terminals (FastAPI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["aiface", "biometric", "attendance", "time-clock", "websocket", "fastapi", "face-recognition"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: System :: Hardware",
]
dependencies = [
  "fastapi>=0.110",
  # uvicorn[standard] brings `websockets`: without a WebSocket library
  # uvicorn answers 404 to the upgrade and no device can connect.
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "websockets>=12"]

[project.scripts]
aiface-ws = "aiface_ws.__main__:main"

[tool.setuptools.packages.find]
include = ["aiface_ws*"]

[tool.setuptools.package-data]
aiface_ws = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
asyncio_mode = "strict"
